<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/proyecta-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PROYECTA | Ciencia financiada con minería comunitaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <!--
      Cache-buster: detecta cambios de bundle y fuerza una recarga en el navegador.
      Se ejecuta ANTES de React para evitar que la app vieja arranque.
    -->
    <script>
      (function () {
        try {
          var BUILD_KEY = "proyecta_build_id";
          var CURRENT = "%%PROYECTA_BUILD_ID%%";
          var stored = localStorage.getItem(BUILD_KEY);
          if (stored && stored !== CURRENT) {
            // Build nuevo detectado: actualiza la marca y recarga desde la red.
            localStorage.setItem(BUILD_KEY, CURRENT);
            // Fuerza la recarga ignorando la cache del navegador.
            window.location.reload(true);
            return;
          }
          if (!stored) {
            localStorage.setItem(BUILD_KEY, CURRENT);
          }
        } catch (e) {
          // localStorage no disponible: continuar sin bloquear la aplicacion.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
